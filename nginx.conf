events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Gzip compression
    gzip on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=files:10m rate=30r/s;
    
    # Pass the address the user really used on to the app, so the links it builds
    # (M3U, XMLTV, HDHomeRun lineup) work in other players.
    # $host drops the port (8247:80 mappings), so use $http_host. If a reverse proxy
    # in front already set X-Forwarded-Proto/Host (e.g. https), keep its values.
    map $http_x_forwarded_proto $tfs_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $http_x_forwarded_host $tfs_forwarded_host {
        default $http_x_forwarded_host;
        ""      $http_host;
    }

    # Upstream servers
    upstream backend {
        server 127.0.0.1:3000;
    }

    server {
        listen 80;
        server_name _;
        # Keep redirects (e.g. /login -> /login/) relative so the browser keeps the
        # host, port and https it used; otherwise a mapped port like 8247:80 is lost.
        absolute_redirect off;
        root /app/apps/web/out;
        index index.html;
        
        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        
        # Static files directory
        location /files/ {
            alias /app/static/;
            
            # Rate limiting for file downloads
            limit_req zone=files burst=10 nodelay;
            
            # Optimize for .m3u and .xml files
            location ~* \.(m3u|m3u8|xml)$ {
                expires 5m;
                add_header Cache-Control "public, no-transform";
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
                add_header Access-Control-Allow-Headers "Range";
                
                # Handle CORS preflight
                if ($request_method = 'OPTIONS') {
                    add_header Access-Control-Allow-Origin "*";
                    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
                    add_header Access-Control-Allow-Headers "Range";
                    add_header Access-Control-Max-Age 86400;
                    add_header Content-Length 0;
                    add_header Content-Type text/plain;
                    return 204;
                }
            }
            
            # Other static files
            location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
        
        # Live / catchup video — disable buffering so nginx does not hold TS in RAM
        location /api/video {
            limit_req zone=api burst=40 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $tfs_forwarded_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $tfs_forwarded_proto;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            chunked_transfer_encoding on;
            add_header X-Accel-Buffering no;

            # Long-lived mpegts sessions (hours)
            proxy_connect_timeout 60s;
            proxy_send_timeout 24h;
            proxy_read_timeout 24h;
        }

        # HDHomeRun emulation: clients look for these at the device root.
        location ~ ^/(discover|lineup|lineup_status)\.json$ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $tfs_forwarded_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $tfs_forwarded_proto;
        }

        # API routes
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $tfs_forwarded_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $tfs_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
            
            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # RPC routes (for ORPC)
        location /rpc/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $tfs_forwarded_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $tfs_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
            
            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # Health check endpoint
        location /health {
            proxy_pass http://backend/api/health;
            access_log off;
        }
        
        # Media endpoints (M3U/XML) - route to backend
        location /media.m3u {
            limit_req zone=api burst=10 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $tfs_forwarded_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $tfs_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
            
            # Cache headers for media files
            expires 5m;
            add_header Cache-Control "public, no-transform";
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            
            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        location /media.xml {
            limit_req zone=api burst=10 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $tfs_forwarded_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $tfs_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
            
            # Disable caching to keep XML always up-to-date
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            
            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Images proxy (e.g., /images/plex) - route to backend
        location /images/ {
            # Posters load through here (a library page asks for dozens at once),
            # so allow a large burst instead of the 20-request API burst.
            limit_req zone=files burst=200 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $tfs_forwarded_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $tfs_forwarded_proto;
            proxy_cache_bypass $http_upgrade;

            # The app sets Cache-Control: images loaded with a session are private,
            # signed player links are public.
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";

            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # Deep links to /channels/:id (static export + SPA)
        location ~ ^/channels/[^/.]+$ {
            try_files /channels/index.html /index.html;
        }

        # Static SPA (exported Next.js client)
        location / {
            try_files $uri $uri/ $uri.html /index.html;
        }
    }
} 