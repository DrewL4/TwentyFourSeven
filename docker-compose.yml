version: '3.8'

services:
  twentyfourseven:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./database:/app/database
      - ./static:/app/static
      # Your videos, read-only. Use the same folders Plex or ESPG use.
      # Remove these two lines if you only use Plex.
      - /path/to/Movies:/movies:ro
      - /path/to/TV:/tv:ro
      # Optional, only for Settings > YouTube: a folder TFS may write to (also set YOUTUBE_DOWNLOAD_DIR=/youtube)
      # - /path/to/YouTube:/youtube
    environment:
      # External domain configuration (set these if you use a reverse proxy / your own domain)
      # - EXTERNAL_DOMAIN=tv.example.com
      # - EXTERNAL_PROTOCOL=https
      - EXTERNAL_HTTP_PORT=8080
      
      # Database configuration
      - DATABASE_URL=file:/app/database/production.db
      
      # Authentication: leave BETTER_AUTH_SECRET unset to have one generated once and
      # saved in ./database (kept across restarts). Set it yourself to override.
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      
      # Video folders inside the container (optional; /movies and /tv are used by default)
      # - LOCAL_MEDIA_PATHS=/movies,/tv
      # Where YouTube downloads go (needs a writable folder; /tv and /movies are read-only)
      # - YOUTUBE_DOWNLOAD_DIR=/youtube

      # GPU settings (optional)
      - GPU_DETECTION_ENABLED=true
      - ENABLE_HARDWARE_ACCEL=true
      
      # Trusted origins for security
      # - TRUSTED_ORIGINS=https://tv.example.com,http://localhost:8080
    
    # For GPU support (optional)
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    #   - NVIDIA_DRIVER_CAPABILITIES=all
    
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s 